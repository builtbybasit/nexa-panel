AuditEvent:
  type: object
  required:
  - id
  - occurredAt
  - action
  - subject
  - metadata
  properties:
    id:
      type: integer
      format: int64
    occurredAt:
      type: string
      format: date-time
    actorUserId:
      type: string
    action:
      type: string
    subject:
      type: string
    remoteAddress:
      type: string
    metadata:
      type: object
      additionalProperties: true
