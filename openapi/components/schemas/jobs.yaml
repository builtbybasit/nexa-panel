Job:
  type: object
  required:
  - id
  - kind
  - state
  - progress
  - request
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    kind:
      type: string
    state:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    progress:
      type: integer
      minimum: 0
      maximum: 100
    actorUserId:
      type: string
    request:
      type: object
      additionalProperties: true
    result:
      type: object
      additionalProperties: true
    failure:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
JobEvent:
  type: object
  required:
  - sequence
  - jobId
  - state
  - progress
  - message
  - occurredAt
  properties:
    sequence:
      type: integer
      format: int64
    jobId:
      type: integer
      format: int64
    state:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    progress:
      type: integer
      minimum: 0
      maximum: 100
    message:
      type: string
    occurredAt:
      type: string
      format: date-time
