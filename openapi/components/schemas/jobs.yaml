Job:
  type: object
  required:
  - id
  - kind
  - state
  - progress
  - attempt
  - request
  - createdAt
  - updatedAt
  properties:
    id:
      type: integer
      format: int64
    kind:
      type: string
    title:
      type: string
    state:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    progress:
      type: integer
      minimum: 0
      maximum: 100
    actorUserId:
      type: string
    siteIds:
      type: array
      description: Site scope used to enforce developer grants; omitted for unscoped jobs.
      uniqueItems: true
      items:
        type: string
    attempt:
      type: integer
      minimum: 0
      description: Number of worker leases claimed for this job.
    request:
      description: >-
        Kind-specific JSON payload; it may be an object, array, scalar, or null.
        Credential-shaped fields (password, secret, token, key, passphrase, and
        similar) are replaced with the string "[redacted]" on the response path.
    result:
      description: >-
        Kind-specific JSON result; it may be an object, array, scalar, or null.
        Redacted the same way as request.
    failure:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    completedAt:
      type: string
      format: date-time
JobEvent:
  type: object
  required:
  - sequence
  - jobId
  - state
  - progress
  - message
  - occurredAt
  properties:
    sequence:
      type: integer
      format: int64
    jobId:
      type: integer
      format: int64
    state:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    progress:
      type: integer
      minimum: 0
      maximum: 100
    message:
      type: string
    occurredAt:
      type: string
      format: date-time
