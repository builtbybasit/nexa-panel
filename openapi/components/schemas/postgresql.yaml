PostgreSQLStatus:
  type: string
  enum:
  - planning
  - plan_ready
  - applying
  - active
  - online
  - down
  - backing_up
  - verified
  - restoring
  - failed
CreatePostgreSQLInstance:
  type: object
  additionalProperties: false
  required:
  - version
  - cluster
  properties:
    version:
      type: string
      enum:
      - '16'
      - '17'
      - '18'
    cluster:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,30}$
    port:
      type: integer
      minimum: 1024
      maximum: 65535
PostgreSQLInstance:
  type: object
  required:
  - id
  - version
  - cluster
  - port
  - status
  - owner
  - dataPath
  - socketPath
  - logPath
  - configPath
  - systemdUnit
  - managedByNexa
  properties:
    id:
      type: string
    version:
      type: string
      enum:
      - '16'
      - '17'
      - '18'
    cluster:
      type: string
    port:
      type: integer
    status:
      $ref: '#/PostgreSQLStatus'
    owner:
      type: string
    dataPath:
      type: string
    socketPath:
      type: string
    logPath:
      type: string
    configPath:
      type: string
    systemdUnit:
      type: string
    managedByNexa:
      type: boolean
    lastJobId:
      type: integer
      format: int64
    failure:
      type: string
CreatePostgreSQLRole:
  type: object
  additionalProperties: false
  required:
  - instanceId
  - name
  properties:
    instanceId:
      type: string
    name:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,62}$
PostgreSQLRole:
  type: object
  required:
  - id
  - instanceId
  - name
  - status
  - credentialAvailable
  - credentialVersion
  properties:
    id:
      type: string
    instanceId:
      type: string
    name:
      type: string
    status:
      $ref: '#/PostgreSQLStatus'
    credentialAvailable:
      type: boolean
    credentialVersion:
      type: integer
      minimum: 0
    lastJobId:
      type: integer
      format: int64
    failure:
      type: string
CreateManagedPostgreSQLDatabase:
  type: object
  additionalProperties: false
  required:
  - instanceId
  - name
  - ownerRoleId
  properties:
    instanceId:
      type: string
    name:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,62}$
    ownerRoleId:
      type: string
ManagedPostgreSQLDatabase:
  type: object
  required:
  - id
  - instanceId
  - name
  - ownerRoleId
  - status
  - createdAt
  - updatedAt
  properties:
    id:
      type: string
    instanceId:
      type: string
    name:
      type: string
    ownerRoleId:
      type: string
    status:
      $ref: '#/PostgreSQLStatus'
    sizeBytes:
      type: integer
      format: int64
      minimum: 0
      description: On-disk size measured while serving a read and refreshed at most once a minute, so it may lag reality; absent until the database has been measured for the first time.
    sizeObservedAt:
      type: string
      format: date-time
      description: When sizeBytes was last measured; absent while sizeBytes is.
    lastJobId:
      type: integer
      format: int64
    failure:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
CreatePostgreSQLGrant:
  type: object
  additionalProperties: false
  required:
  - databaseId
  - roleId
  - access
  properties:
    databaseId:
      type: string
    roleId:
      type: string
    access:
      type: string
      enum:
      - connect
      - read_only
      - read_write
PostgreSQLGrant:
  type: object
  required:
  - id
  - databaseId
  - roleId
  - access
  - status
  properties:
    id:
      type: string
    databaseId:
      type: string
    roleId:
      type: string
    access:
      type: string
      enum:
      - connect
      - read_only
      - read_write
    status:
      $ref: '#/PostgreSQLStatus'
    lastJobId:
      type: integer
      format: int64
    failure:
      type: string
PostgreSQLRestorePoint:
  type: object
  required:
  - id
  - databaseId
  - status
  properties:
    id:
      type: string
    databaseId:
      type: string
    status:
      $ref: '#/PostgreSQLStatus'
    sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    sizeBytes:
      type: integer
      format: int64
      minimum: 0
    verifiedAt:
      type: string
      format: date-time
    lastJobId:
      type: integer
      format: int64
    failure:
      type: string
PostgreSQLStoredPlan:
  type: object
  required:
  - id
  - resourceType
  - resourceId
  - operation
  - agentPlan
  - createdAt
  - expiresAt
  properties:
    id:
      type: string
    resourceType:
      type: string
      enum:
      - instance
      - role
      - database
      - grant
      - restore_point
    resourceId:
      type: string
    operation:
      type: string
      enum:
      - instance.provision
      - role.create
      - role.rotate
      - database.create
      - grant.apply
      - backup.create
      - backup.restore
    agentPlan:
      type: object
      required:
      - id
      - kind
      - change
      - steps
      - warnings
      - observedFingerprint
      - interruption
      - plannedAt
      - expiresAt
      - signature
      properties:
        id:
          type: string
        kind:
          type: string
          const: nexa.postgresql.v1
        change:
          type: object
          additionalProperties: true
        steps:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        observedFingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        interruption:
          type: boolean
        plannedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signature:
          type: string
    createdAt:
      type: string
      format: date-time
    expiresAt:
      type: string
      format: date-time
