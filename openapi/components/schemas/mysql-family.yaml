MySQLFamilyEngine:
  type: object
  required:
  - id
  - kind
  - version
  - versionText
  - socketPath
  - port
  - status
  - systemdUnit
  properties:
    id:
      type: string
      enum:
      - mysql
      - mariadb
    kind:
      type: string
      enum:
      - mysql
      - mariadb
    version:
      type: string
    versionText:
      type: string
    socketPath:
      type: string
    port:
      type: integer
      minimum: 1
      maximum: 65535
    status:
      type: string
      enum:
      - online
    systemdUnit:
      type: string
CreateMySQLFamilyAccount:
  type: object
  additionalProperties: false
  required:
  - engineId
  - name
  properties:
    engineId:
      type: string
      enum:
      - mysql
      - mariadb
    name:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,62}$
    host:
      type: string
      default: localhost
CreateMySQLFamilyDatabase:
  type: object
  additionalProperties: false
  required:
  - engineId
  - name
  - ownerAccountId
  properties:
    engineId:
      type: string
      enum:
      - mysql
      - mariadb
    name:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,62}$
    ownerAccountId:
      type: string
MySQLFamilyDatabase:
  type: object
  required:
  - id
  - engineId
  - name
  - ownerAccountId
  - status
  - createdAt
  - updatedAt
  properties:
    id:
      type: string
    engineId:
      type: string
      enum:
      - mysql
      - mariadb
    name:
      type: string
    ownerAccountId:
      type: string
    status:
      type: string
      enum:
      - planning
      - plan_ready
      - applying
      - active
      - backing_up
      - verified
      - restoring
      - failed
    sizeBytes:
      type: integer
      format: int64
      minimum: 0
      description: On-disk size measured while serving a read and refreshed at most once a minute, so it may lag reality; absent until the database has been measured for the first time.
    sizeObservedAt:
      type: string
      format: date-time
      description: When sizeBytes was last measured; absent while sizeBytes is.
    lastJobId:
      type: integer
      format: int64
    failure:
      type: string
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
CreateMySQLFamilyGrant:
  type: object
  additionalProperties: false
  required:
  - databaseId
  - accountId
  - access
  properties:
    databaseId:
      type: string
    accountId:
      type: string
    access:
      type: string
      enum:
      - connect
      - read_only
      - read_write
