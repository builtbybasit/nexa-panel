MySQLFamilyEngine:
  type: object
  required:
  - id
  - kind
  - version
  - versionText
  - socketPath
  - port
  - status
  - systemdUnit
  properties:
    id:
      type: string
      enum:
      - mysql
      - mariadb
    kind:
      type: string
      enum:
      - mysql
      - mariadb
    version:
      type: string
    versionText:
      type: string
    socketPath:
      type: string
    port:
      type: integer
      minimum: 1
      maximum: 65535
    status:
      type: string
      enum:
      - online
    systemdUnit:
      type: string
CreateMySQLFamilyAccount:
  type: object
  additionalProperties: false
  required:
  - engineId
  - name
  properties:
    engineId:
      type: string
      enum:
      - mysql
      - mariadb
    name:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,62}$
    host:
      type: string
      default: localhost
CreateMySQLFamilyDatabase:
  type: object
  additionalProperties: false
  required:
  - engineId
  - name
  - ownerAccountId
  properties:
    engineId:
      type: string
      enum:
      - mysql
      - mariadb
    name:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,62}$
    ownerAccountId:
      type: string
CreateMySQLFamilyGrant:
  type: object
  additionalProperties: false
  required:
  - databaseId
  - accountId
  - access
  properties:
    databaseId:
      type: string
    accountId:
      type: string
    access:
      type: string
      enum:
      - connect
      - read_only
      - read_write
