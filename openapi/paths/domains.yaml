domains:
  get:
    operationId: listDomains
    summary: List Domains
    tags:
    - Domains
    x-permission: domains.read
    security:
    - sessionCookie: []
    parameters:
    - name: siteId
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Managed routing identities
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/domains.yaml#/Domain
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  post:
    operationId: createDomain
    summary: Create Domain
    tags:
    - Domains
    x-permission: domains.write
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/domains.yaml#/CreateDomain
    responses:
      '202':
        description: DNS and routing planning was queued
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
domains_id_plan:
  get:
    operationId: getDomainPlan
    summary: Get Domain Plan
    tags:
    - Domains
    x-permission: domains.read
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: DNS preflight and signed routing plan
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
domains_id_activate:
  post:
    operationId: activateDomain
    summary: Activate Domain
    tags:
    - Domains
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '202':
        description: Atomic routing activation was queued
        content:
          application/json:
            schema:
              $ref: ../components/schemas/jobs.yaml#/Job

      '4XX':
        $ref: ../components/responses.yaml#/ClientError
domains_id:
  delete:
    operationId: deleteDomain
    summary: Delete Domain
    tags:
    - Domains
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '202':
        description: Delete Domain
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
