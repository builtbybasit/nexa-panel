health_live:
  get:
    operationId: getLiveness
    summary: Get Liveness
    tags:
    - Platform
    security: []
    responses:
      '200':
        description: The control-plane process is running.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Liveness
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
health_ready:
  get:
    operationId: getReadiness
    summary: Get Readiness
    tags:
    - Platform
    security: []
    responses:
      '200':
        description: The control-plane database and privileged node agent are reachable.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Readiness
      '503':
        description: At least one required local dependency is unavailable.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
modules:
  get:
    operationId: listModules
    summary: List Modules
    tags:
    - Platform
    x-permission: system.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Independently registered feature modules.
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/common.yaml#/ModuleDescriptor
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
system_overview:
  get:
    operationId: getSystemOverview
    summary: Get System Overview
    tags:
    - System
    x-permission: system.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Observed capacity and container-runtime capabilities.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/system.yaml#/SystemOverview

      '4XX':
        $ref: ../components/responses.yaml#/ClientError
system_updates:
  get:
    operationId: getSystemUpdates
    summary: Get Available Panel Update
    tags:
    - System
    x-permission: system.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Installed version and, when newer, the latest available release.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/system.yaml#/SystemUpdateAvailability
      '503':
        description: The node could not be reached to check for updates.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/Error
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
system_updates_apply:
  post:
    operationId: applySystemUpdate
    summary: Install a Panel Update
    description: >-
      Queues a self-update job. This is a sensitive action and requires a recent
      multi-factor step-up. The privileged agent downloads the release, verifies
      its checksum, swaps the binary atomically, and restarts the panel.
    tags:
    - System
    x-permission: system.update
    security:
    - sessionCookie: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/system.yaml#/ApplySystemUpdate
    responses:
      '202':
        description: The panel update was queued as a job.
        content:
          application/json:
            schema:
              type: object
              properties:
                job:
                  $ref: ../components/schemas/jobs.yaml#/Job
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
