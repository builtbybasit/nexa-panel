databases_servers:
  get:
    operationId: listDatabaseServers
    summary: List Database Servers
    tags:
    - Databases
    x-permission: databases.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Database servers across every engine on the node
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/databases.yaml#/DatabaseServer
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  post:
    operationId: createDatabaseServer
    summary: Provision Database Server
    tags:
    - Databases
    x-permission: databases.write
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/databases.yaml#/CreateDatabaseServer
    responses:
      '202':
        description: Server provisioning plan was queued
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
