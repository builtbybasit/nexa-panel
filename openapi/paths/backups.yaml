      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  put:
    operationId: updateBackupPlan
    summary: Update Backup Plan
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
