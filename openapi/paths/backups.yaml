backups_accounts:
  get:
    operationId: listBackupAccounts
    summary: List Backup Accounts
    tags:
    - Backups
    x-permission: backups.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Configured backup storage accounts (site-scoped developers receive only accounts used by fully visible plans)
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  post:
    operationId: createBackupAccount
    summary: Create Backup Account
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    responses:
      '201':
        description: The created backup account
      '422':
        description: Validation failed
backups_accounts_id:
  get:
    operationId: getBackupAccount
    summary: Get Backup Account
    tags:
    - Backups
    x-permission: backups.read
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: A single backup account
      '404':
        description: Not found
  put:
    operationId: updateBackupAccount
    summary: Update Backup Account
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: The updated backup account
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  delete:
    operationId: deleteBackupAccount
    summary: Delete Backup Account
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '204':
        description: Deleted
      '409':
        description: The account is still used by a backup plan
backups_accounts_id_test:
  post:
    operationId: testBackupAccount
    summary: Test Backup Account
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Connectivity result (ok plus a message); a failed connection is 200 with ok=false
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
backups_plans:
  get:
    operationId: listBackupPlans
    summary: List Backup Plans
    tags:
    - Backups
    x-permission: backups.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Backup plans, including installed/error schedule reconciliation state; site-scoped developers receive only plans whose every site is granted
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  post:
    operationId: createBackupPlan
    summary: Create Backup Plan
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    responses:
      '201':
        description: The created backup plan
      '422':
        description: Validation failed
backups_plans_id:
  get:
    operationId: getBackupPlan
    summary: Get Backup Plan
    tags:
    - Backups
    x-permission: backups.read
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: A single backup plan
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  put:
    operationId: updateBackupPlan
    summary: Update Backup Plan
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: The updated backup plan
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  delete:
    operationId: deleteBackupPlan
    summary: Delete Backup Plan
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '204':
        description: Deleted (its systemd timer is removed)
      '409':
        description: Stored copies still reference the plan and must be removed first
      '502':
        description: The timer could not be removed, so the plan was retained for reconciliation
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
backups_plans_id_toggle:
  post:
    operationId: toggleBackupPlan
    summary: Toggle Backup Plan
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '204':
        description: Enabled/disabled; the plan's timer is installed or removed to match
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
backups_plans_id_run:
  post:
    operationId: runBackupPlan
    summary: Run Backup Plan
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: Idempotency-Key
      in: header
      required: false
      description: Repeating the same key and request returns the original durable job.
      schema:
        type: string
        maxLength: 200
    responses:
      '202':
        description: A backup.run job was queued (Location header points at the job)
      '409':
        description: The idempotency key was previously used with a different request
backups_plans_id_copies:
  get:
    operationId: listBackupCopies
    summary: List Backup Copies
    tags:
    - Backups
    x-permission: backups.read
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Stored copies for the plan, newest first; uploaded copies remain healthy=false until integrity and restore-test states both pass
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
backups_copies_copyId_restore:
  post:
    operationId: restoreBackupCopy
    summary: Restore Backup Copy
    tags:
    - Backups
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: copyId
      in: path
      required: true
      schema:
        type: string
    - name: Idempotency-Key
      in: header
      required: false
      description: Repeating the same key and request returns the original durable job.
      schema:
        type: string
        maxLength: 200
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - sites
            - databases
            - allowUnverified
            properties:
              allowUnverified:
                type: boolean
                description: Explicit acknowledgement required when the copy has no passing integrity check.
              sites:
                type: array
                maxItems: 128
                description: Entries and destination site IDs must each be unique within the restore request.
                items:
                  type: object
                  additionalProperties: false
                  required: [entry, siteId, clear]
                  properties:
                    entry: {type: string}
                    siteId: {type: string}
                    clear: {type: boolean}
              databases:
                type: array
                maxItems: 128
                description: Entries and destination database references must each be unique within the restore request.
                items:
                  type: object
                  additionalProperties: false
                  required: [entry, databaseRef, clear]
                  properties:
                    entry: {type: string}
                    databaseRef: {type: string, pattern: '^(postgres|mysql):.+'}
                    clear: {type: boolean}
    responses:
      '202':
        description: A backup.restore job was queued
      '409':
        description: The idempotency key conflicts or an unverified restore was not explicitly acknowledged
      '422':
        description: A selected item is not part of the copy, or nothing was selected
backups_copies_copyId:
  delete:
    operationId: deleteBackupCopy
    summary: Delete Backup Copy
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: copyId
      in: path
      required: true
      schema:
        type: string
    responses:
      '204':
        description: The copy was purged from storage and its record removed

      '4XX':
        $ref: ../components/responses.yaml#/ClientError
backups_system:
  get:
    operationId: listSystemBackups
    summary: List Panel-State Backups
    description: >-
      Panel-state ("system") backups snapshot the control database and master
      key off-node so a disk loss is recoverable. They are global and restricted
      to operator roles (developers are refused).
    tags:
    - Backups
    x-permission: backups.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Stored panel-state copies, newest first
      '403':
        description: The caller has a site-scoped (developer) role
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  post:
    operationId: runSystemBackup
    summary: Back Up Panel State
    description: >-
      Queues a backup.system job that snapshots control.db (via SQLite VACUUM
      INTO) plus master.key into a single archive and uploads it to the chosen
      storage account. The archive is credential-equivalent, so the account's
      remote must be trusted/encrypted.
    tags:
    - Backups
    x-permission: backups.write
    security:
    - sessionCookie: []
    parameters:
    - name: Idempotency-Key
      in: header
      required: false
      description: Repeating the same key and request returns the original durable job.
      schema:
        type: string
        maxLength: 200
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - accountId
            properties:
              accountId:
                type: string
                description: The storage account to upload the panel-state archive to.
    responses:
      '202':
        description: A backup.system job was queued (Location header points at the job)
      '403':
        description: The caller has a site-scoped (developer) role
      '409':
        description: The idempotency key was previously used with a different request
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
