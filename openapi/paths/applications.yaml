applications:
  get:
    operationId: listApplications
    summary: List Applications
    tags:
    - Applications
    x-permission: applications.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Installable application catalog joined with observed package state
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
applications_id_plan:
  get:
    operationId: getApplicationPlan
    summary: Get Application Plan
    tags:
    - Applications
    x-permission: applications.read
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Agent-signed apt package plan awaiting approval
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
  post:
    operationId: prepareApplicationChange
    summary: Prepare Application Change
    tags:
    - Applications
    x-permission: applications.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - action
            properties:
              action:
                type: string
                enum:
                - package.install
                - package.remove
    responses:
      '202':
        description: Application change planning was queued
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
applications_id_apply:
  post:
    operationId: applyApplicationPlan
    summary: Apply Application Plan
    tags:
    - Applications
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '202':
        description: Reviewed apt package operation was queued
        content:
          application/json:
            schema:
              $ref: ../components/schemas/jobs.yaml#/Job

      '4XX':
        $ref: ../components/responses.yaml#/ClientError