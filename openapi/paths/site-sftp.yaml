site_sftp:
  get:
    operationId: getSiteSftpAccess
    summary: Get Site SFTP Access
    tags:
    - Site Tools
    x-permission: sites.read
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Get Site SFTP Access
      '4XX':
        $ref: ../components/responses.yaml#/ClientError

site_sftp_enable:
  post:
    operationId: enableSiteSftpAccess
    summary: Enable Site SFTP Access
    tags:
    - Site Tools
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '202':
        description: Enable Site SFTP Access
      '4XX':
        $ref: ../components/responses.yaml#/ClientError

site_sftp_disable:
  post:
    operationId: disableSiteSftpAccess
    summary: Disable Site SFTP Access
    tags:
    - Site Tools
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '202':
        description: Disable Site SFTP Access
      '4XX':
        $ref: ../components/responses.yaml#/ClientError

site_sftp_credentials:
  post:
    operationId: stageSiteSftpCredentials
    summary: Stage Site SFTP Credentials
    description: Records a caller-chosen SFTP password (stored only as a bcrypt
      hash) for a site that has not been activated yet; the activation installs
      it and enables the jail. Refused for active sites.
    tags:
    - Site Tools
    x-permission: sites.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - password
            properties:
              password:
                type: string
                minLength: 12
                maxLength: 72
    responses:
      '200':
        description: Stage Site SFTP Credentials
      '4XX':
        $ref: ../components/responses.yaml#/ClientError

site_sftp_reset_password:
  post:
    operationId: resetSiteSftpPassword
    summary: Reset Site SFTP Password
    tags:
    - Site Tools
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '202':
        description: Reset Site SFTP Password
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
