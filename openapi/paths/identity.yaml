auth_status:
  get:
    operationId: getIdentityStatus
    summary: Get Identity Status
    tags:
    - Identity
    security: []
    responses:
      '200':
        description: Bootstrap and current-session status.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/IdentityStatus
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
auth_bootstrap:
  post:
    operationId: bootstrapAdministrator
    summary: Bootstrap Administrator
    tags:
    - Identity
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/BootstrapRequest
    responses:
      '201':
        description: The first administrator and session were created.
        headers:
          Set-Cookie:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/PasswordResponse
      '409':
        description: An administrator already exists.
auth_login:
  post:
    operationId: login
    summary: Login
    tags:
    - Identity
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/Credentials
    responses:
      '200':
        description: Credentials were accepted and a session was created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/PasswordResponse
      '401':
        description: The credentials were not accepted.
      '429':
        description: Too many password attempts were made from the client address.
auth_mfa_enroll:
  post:
    operationId: enrollMFA
    summary: Enroll MFA
    tags:
    - Identity
    security:
    - sessionCookie: []
    description: >-
      Create (or return) TOTP enrollment material for the signed-in account.
      Enrollment is optional for every role; nothing is enforced until the
      matching code is confirmed.
    responses:
      '200':
        description: Encrypted TOTP enrollment material for the signed-in user.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/MFAEnrollment
      '409':
        description: MFA is already enrolled.
auth_mfa_confirm:
  post:
    operationId: confirmMFA
    summary: Confirm MFA
    tags:
    - Identity
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - code
            properties:
              code:
                $ref: ../components/schemas/identity.yaml#/TOTPCode
    responses:
      '200':
        description: Enrollment was confirmed; recovery codes are returned once.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/MFAConfirmation
      '401':
        description: The TOTP was invalid, expired, or previously accepted.
      '429':
        description: Too many verification attempts were made.
auth_mfa_verify:
  post:
    operationId: verifyMFA
    summary: Verify MFA
    tags:
    - Identity
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
            - type: object
              additionalProperties: false
              required:
              - code
              properties:
                code:
                  $ref: ../components/schemas/identity.yaml#/TOTPCode
            - type: object
              additionalProperties: false
              required:
              - recoveryCode
              properties:
                recoveryCode:
                  $ref: ../components/schemas/identity.yaml#/RecoveryCode
    description: >-
      Answer the sign-in challenge of an enrolled account with an authenticator
      code or one single-use recovery code. Recovery codes are accepted from
      every role, including admin.
    responses:
      '200':
        description: The challenged session is now fully authenticated.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/UserResponse
      '401':
        description: The TOTP or recovery code was invalid or already consumed.
      '429':
        description: Too many verification attempts were made.
auth_mfa_recover:
  post:
    operationId: recoverMFA
    summary: Replace a lost MFA factor
    tags:
    - Identity
    description: >-
      Consume one recovery code and rotate the signed-in account onto fresh MFA
      enrollment material, retiring the lost factor. Every other session is
      revoked, so the replacement is paired from this session alone. Available to
      every enrolled role, not administrators alone: the recovery code is the
      credential. An account that lost both its authenticator and its recovery
      codes needs the offline break-glass path instead
      (`sudo nexa mfa reset --user <name>`; see docs/runbooks/mfa-recovery.md).
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - recoveryCode
            properties:
              recoveryCode:
                $ref: ../components/schemas/identity.yaml#/RecoveryCode
    responses:
      '200':
        description: The old factor was retired and replacement enrollment material was created.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/MFAEnrollment
      '401':
        description: The recovery code was invalid or already consumed.
      '429':
        description: Too many recovery attempts were made.
auth_mfa_disable:
  post:
    operationId: disableMFA
    summary: Disable MFA
    tags:
    - Identity
    description: >-
      Turn off the second factor for the signed-in account, in any role including
      admin. Enrollment is optional, so disabling is a deliberate and audited
      choice — but it is gated like any sensitive action: the session must have
      completed an MFA challenge (step-up) and the request must carry the account
      password, so a stolen password alone can never strip MFA.
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/MFADisableRequest
    responses:
      '200':
        description: The second factor was removed.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/MFADisableResponse
      '401':
        description: The session is not fully authenticated, or the password is incorrect.
      '403':
        description: The session has not completed a second-factor challenge.
      '409':
        description: Multi-factor authentication is not enabled.
      '429':
        description: Too many attempts were made.
auth_password:
  post:
    operationId: changePassword
    summary: Change Password
    tags:
    - Identity
    description: >-
      Change the signed-in account's password. Requires a fully authenticated
      session and the current password. On success the current session stays
      valid and the account's other sessions are revoked.
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.yaml#/ChangePasswordRequest
    responses:
      '204':
        description: The password was changed.
      '401':
        description: The session is not fully authenticated, or the current password is incorrect.
      '422':
        description: The new password is invalid or unchanged.
      '429':
        description: Too many attempts were made.
auth_session:
  get:
    operationId: getSession
    summary: Get Session
    tags:
    - Identity
    security:
    - sessionCookie: []
    responses:
      '200':
        description: The authenticated administrator.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/UserResponse
      '401':
        description: A valid session is required.
auth_logout:
  post:
    operationId: logout
    summary: Logout
    tags:
    - Identity
    security:
    - sessionCookie: []
    responses:
      '204':
        description: The current session was revoked.

      '4XX':
        $ref: ../components/responses.yaml#/ClientError
