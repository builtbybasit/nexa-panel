    responses:
      '202':
        description: Failure-safe credential rotation planning was queued
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
postgresql_roles_id_credential:
  post:
    operationId: revealPostgreSQLCredentialOnce
    summary: Reveal PostgreSQL Credential Once
    tags:
    - Databases
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: One-time, non-cacheable credential response
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              type: object
              required:
              - credential
              properties:
                credential:
                  type: string
                  format: password
                  x-one-time-secret: true
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
