    operationId: rotatePostgreSQLRole
    summary: Rotate PostgreSQL Role
    tags:
    - Databases
    x-permission: databases.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
