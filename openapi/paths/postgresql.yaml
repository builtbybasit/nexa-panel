postgresql_instances:
  get:
    operationId: listPostgreSQLInstances
    tags:
    - Databases
    x-permission: databases.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Discovered PostgreSQL 16-18 instances
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/postgresql.yaml#/PostgreSQLInstance
  post:
    operationId: createPostgreSQLInstance
    tags:
    - Databases
    x-permission: databases.write
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/postgresql.yaml#/CreatePostgreSQLInstance
    responses:
      '202':
        description: PostgreSQL instance provisioning plan was queued
postgresql_roles:
  get:
    operationId: listPostgreSQLRoles
    tags:
    - Databases
    x-permission: databases.read
    security:
    - sessionCookie: []
    responses:
      '200':
        description: Managed non-superuser login roles
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/postgresql.yaml#/PostgreSQLRole
  post:
    operationId: createPostgreSQLRole
    tags:
    - Databases
    x-permission: databases.write
    security:
    - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/postgresql.yaml#/CreatePostgreSQLRole
    responses:
      '202':
        description: Role creation and encrypted credential planning was queued
postgresql_roles_id_rotate:
  post:
    operationId: rotatePostgreSQLRole
    tags:
    - Databases
    x-permission: databases.write
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '202':
        description: Failure-safe credential rotation planning was queued
postgresql_roles_id_credential:
  post:
    operationId: revealPostgreSQLCredentialOnce
    tags:
    - Databases
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: One-time, non-cacheable credential response
        headers:
          Cache-Control:
            schema:
              type: string
              const: no-store
        content:
          application/json:
            schema:
              type: object
              required:
              - credential
              properties:
                credential:
                  type: string
                  format: password
                  x-one-time-secret: true
