postgresql_resourceType_id_plan:
  get:
    operationId: getPostgreSQLPlan
    tags:
    - Databases
    x-permission: databases.read
    security:
    - sessionCookie: []
    parameters:
    - name: resourceType
      in: path
      required: true
      schema:
        type: string
        enum:
        - instances
        - roles
        - databases
        - grants
        - restore-points
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Agent-signed PostgreSQL plan
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  $ref: ../components/schemas/postgresql.yaml#/PostgreSQLStoredPlan
postgresql_resourceType_id_apply:
  post:
    operationId: applyPostgreSQLPlan
    tags:
    - Databases
    x-permission: operations.apply
    security:
    - sessionCookie: []
    parameters:
    - name: resourceType
      in: path
      required: true
      schema:
        type: string
        enum:
        - instances
        - roles
        - databases
        - grants
        - restore-points
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '202':
        description: Reviewed PostgreSQL operation was queued
        content:
          application/json:
            schema:
              $ref: ../components/schemas/jobs.yaml#/Job
