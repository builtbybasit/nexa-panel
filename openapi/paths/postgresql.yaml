postgresql_resourceType_id_plan:
  get:
    operationId: getPostgreSQLPlan
    summary: Get PostgreSQL Plan
    tags:
    - Databases
    x-permission: databases.read
    security:
    - sessionCookie: []
    parameters:
    - name: resourceType
      in: path
      required: true
      schema:
        type: string
        enum:
        - instances
        - roles
        - databases
        - grants
        - restore-points
    - name: id
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Agent-signed PostgreSQL plan
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  $ref: ../components/schemas/postgresql.yaml#/PostgreSQLStoredPlan
      '4XX':
        $ref: ../components/responses.yaml#/ClientError
