openapi: 3.1.0
info:
  title: Nexa Panel HTTP Interface
  version: 0.1.0
  description: Initial control-plane contract for the Nexa Panel foundation.
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Platform]
      responses:
        "200":
          description: The control-plane process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /modules:
    get:
      operationId: listModules
      tags: [Platform]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Independently registered feature modules.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModuleDescriptor"
  /system/overview:
    get:
      operationId: getSystemOverview
      tags: [System]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Observed capacity and container-runtime capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemOverview"
  /auth/status:
    get:
      operationId: getIdentityStatus
      tags: [Identity]
      responses:
        "200":
          description: Bootstrap and current-session status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityStatus"
  /auth/bootstrap:
    post:
      operationId: bootstrapAdministrator
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: The first administrator and session were created.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResponse"
        "409":
          description: An administrator already exists.
  /auth/login:
    post:
      operationId: login
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Credentials were accepted and a session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResponse"
        "401":
          description: The credentials were not accepted.
        "429":
          description: Too many password attempts were made from the client address.
  /auth/mfa/enroll:
    post:
      operationId: enrollMFA
      tags: [Identity]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Encrypted TOTP enrollment material for the pre-authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAEnrollment"
        "409":
          description: MFA is already enrolled.
  /auth/mfa/confirm:
    post:
      operationId: confirmMFA
      tags: [Identity]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code:
                  $ref: "#/components/schemas/TOTPCode"
      responses:
        "200":
          description: Enrollment was confirmed; recovery codes are returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAConfirmation"
        "401":
          description: The TOTP was invalid, expired, or previously accepted.
        "429":
          description: Too many verification attempts were made.
  /auth/mfa/verify:
    post:
      operationId: verifyMFA
      tags: [Identity]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [code]
                  properties:
                    code:
                      $ref: "#/components/schemas/TOTPCode"
                - type: object
                  additionalProperties: false
                  required: [recoveryCode]
                  properties:
                    recoveryCode:
                      type: string
                      pattern: "^[A-Fa-f0-9]{4}(-[A-Fa-f0-9]{4}){3}$"
      responses:
        "200":
          description: The pre-authenticated session is now fully authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: The TOTP or recovery code was invalid or already consumed.
        "429":
          description: Too many verification attempts were made.
  /auth/session:
    get:
      operationId: getSession
      tags: [Identity]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The authenticated administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: A valid session is required.
  /auth/logout:
    post:
      operationId: logout
      tags: [Identity]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The current session was revoked.
  /users:
    get:
      operationId: listUsers
      tags: [Users]
      x-permission: users.manage
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All managed users with their developer site grants.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagedUser"
    post:
      operationId: createUser
      tags: [Users]
      x-permission: users.manage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: The managed user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "409": {description: A user with this username already exists., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: The username or password or role is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /users/{id}:
    patch:
      operationId: updateUser
      tags: [Users]
      x-permission: users.manage
      security:
        - sessionCookie: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        "200":
          description: The updated user; every live session of the user was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400": {description: Neither a role nor a password was provided., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: The user does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: The last administrator cannot lose the admin role., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: The role or password is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    delete:
      operationId: deleteUser
      tags: [Users]
      x-permission: users.manage
      security:
        - sessionCookie: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "204":
          description: The user plus their sessions and site grants were removed.
        "404": {description: The user does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: The last administrator or your own account cannot be deleted., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /users/{id}/sites:
    put:
      operationId: replaceUserSiteGrants
      tags: [Users]
      x-permission: users.manage
      security:
        - sessionCookie: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSiteGrants"
      responses:
        "200":
          description: The developer's site grants were replaced with the deduplicated set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSiteGrants"
        "400": {description: Site grants apply to developer users only., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: The user does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: A granted site does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Site grants are not configured on this control plane., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /audit/events:
    get:
      operationId: listAuditEvents
      tags: [Audit]
      x-permission: audit.read
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Most recent append-only audit events.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
  /jobs:
    get:
      operationId: listJobs
      tags: [Jobs]
      x-permission: jobs.read
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Most recent durable jobs.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [Jobs]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: Current durable job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: The job does not exist.
  /jobs/{id}/events:
    get:
      operationId: streamJobEvents
      tags: [Jobs]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobID"
        - name: Last-Event-ID
          in: header
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Replayable Server-Sent Events until the job reaches a terminal state.
          content:
            text/event-stream:
              schema:
                type: string
  /jobs/diagnostics:
    post:
      operationId: submitDiagnostics
      tags: [Jobs]
      x-permission: operations.apply
      security:
        - sessionCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                delayMilliseconds:
                  type: integer
                  minimum: 10
                  maximum: 2000
                  default: 100
      responses:
        "202":
          description: The safe diagnostic job was persisted and queued.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /node/probe/observe:
    get:
      operationId: observeManagedProbe
      tags: [Node Operations]
      x-permission: system.read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current state of the fixed Nexa-owned probe target.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSnapshot"
        "503":
          description: The privileged node agent is unavailable.
  /node/probe/plan:
    post:
      operationId: planManagedProbe
      tags: [Node Operations]
      x-permission: operations.plan
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeChange"
      responses:
        "200":
          description: A signed, time-limited plan issued by the privileged agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePlan"
  /node/probe/apply:
    post:
      operationId: applyManagedProbePlan
      tags: [Node Operations]
      x-permission: operations.apply
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodePlan"
      responses:
        "202":
          description: The signed plan was persisted as a durable job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /node/probe/rollback:
    post:
      operationId: rollbackManagedProbePlan
      tags: [Node Operations]
      x-permission: operations.apply
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodePlan"
      responses:
        "202":
          description: A rollback of the signed plan was persisted as a durable job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /runtimes:
    get:
      operationId: listRuntimes
      tags: [Runtimes]
      x-permission: runtimes.read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Installed and enabled PHP-FPM 7.4 and 8.x runtimes discovered on the node.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Runtime"
  /sites:
    get:
      operationId: listSites
      tags: [Sites]
      x-permission: sites.read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Desired sites managed by the control plane.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Site"
    post:
      operationId: createSite
      tags: [Sites]
      x-permission: sites.write
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSite"
      responses:
        "202":
          description: The site desired state was persisted and its configuration plan was queued.
          content:
            application/json:
              schema:
                type: object
                required: [site, job]
                properties:
                  site:
                    $ref: "#/components/schemas/Site"
                  job:
                    $ref: "#/components/schemas/Job"
        "422":
          description: The site identity, domain, or selected runtime is not allowed.
  /sites/{id}:
    get:
      operationId: getSite
      tags: [Sites]
      x-permission: sites.read
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One managed site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          description: The site does not exist.
  /sites/{id}/plan:
    get:
      operationId: getSitePlan
      tags: [Sites]
      x-permission: sites.read
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Immutable generated artifacts awaiting privileged node validation.
          content:
            application/json:
              schema:
                type: object
                required: [plan, expiresAt]
                properties:
                  plan:
                    $ref: "#/components/schemas/SitePlan"
                  expiresAt:
                    type: string
                    format: date-time
        "404":
          description: A plan is not ready for this site.
    post:
      operationId: refreshSitePlan
      tags: [Sites]
      x-permission: sites.write
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "202": {description: A new agent-signed site plan was queued, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
  /sites/{id}/activate:
    post:
      operationId: activateSite
      tags: [Sites]
      x-permission: operations.apply
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "202": {description: Signed site activation was queued, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
  /sites/{id}/rollback:
    post:
      operationId: rollbackSite
      tags: [Sites]
      x-permission: operations.apply
      security: [{sessionCookie: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "202": {description: Drift-guarded site rollback was queued, content: {application/json: {schema: {$ref: "#/components/schemas/Job"}}}}
  /sites/{id}/files:
    get:
      operationId: listSiteFiles
      tags: [Files]
      x-permission: files.read
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/SiteID"
        - {name: path, in: query, schema: {type: string}, description: Site-relative directory; defaults to the site root.}
      responses:
        "200":
          description: Bounded directory listing confined to the site root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListing"
        "404": {description: The site or path does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Files are only available while the site is active., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: The path is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /sites/{id}/files/stat:
    get:
      operationId: statSiteFile
      tags: [Files]
      x-permission: files.read
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/SiteID"
        - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Metadata for one entry inside the site root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404": {description: The site or path does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Files are only available while the site is active., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: The path is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /sites/{id}/files/content:
    get:
      operationId: readSiteFileContent
      tags: [Files]
      x-permission: files.read
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/SiteID"
        - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Bounded text content with the entity tag used for conditional writes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReadResult"
        "404": {description: The site or file does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Files are only available while the site is active., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: The path is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    put:
      operationId: writeSiteFileContent
      tags: [Files]
      x-permission: files.write
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/SiteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WriteFile"
      responses:
        "200":
          description: The file was written; the response carries the new entity tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileWriteResult"
        "404": {description: The site or file does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: The expected entity tag no longer matches or the site is not active., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: The path or content is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /sites/{id}/files/download:
    get:
      operationId: downloadSiteFile
      tags: [Files]
      x-permission: files.read
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/SiteID"
        - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: The file streamed as an attachment.
          headers:
            Content-Disposition:
              schema: {type: string}
            Content-Length:
              schema: {type: integer, format: int64, minimum: 0}
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404": {description: The site or file does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Files are only available while the site is active., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: The path is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /sites/{id}/files/mkdir:
    post:
      operationId: createSiteDirectory
      tags: [Files]
      x-permission: files.write
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/SiteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path: {type: string}
      responses:
        "200":
          description: The directory was created and is owned by the site account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404": {description: The site or parent directory does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: The target already exists or the site is not active., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: The path is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /sites/{id}/files/move:
    post:
      operationId: moveSiteFile
      tags: [Files]
      x-permission: files.write
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/SiteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to]
              properties:
                from: {type: string}
                to: {type: string}
                overwrite: {type: boolean, default: false}
      responses:
        "200":
          description: The entry was renamed inside the site root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404": {description: The site or source does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: The destination already exists or the site is not active., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: A path is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /sites/{id}/files/copy:
    post:
      operationId: copySiteFile
      tags: [Files]
      x-permission: files.write
      security: [{sessionCookie: []}]
      parameters:
        - $ref: "#/components/parameters/SiteID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from, to]
              properties:
                from: {type: string}
                to: {type: string}
      responses:
        "200":
          description: The file or directory tree was copied inside the site root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCopyResult"
        "404": {description: The site or source does not exist., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: The destination already exists or the site is not active., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "422": {description: A path is not allowed., content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /sites/{id}/files/delete:
    post:
      operationId: deleteSiteFile
      tags: [Files]
