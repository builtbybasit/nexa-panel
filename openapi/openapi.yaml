                sourceEngine: {type: string, enum: [postgresql, mysql]}
                databaseId: {type: string}
                accountId: {type: string}
      responses:
        "201":
          description: One-time launch cookie and credential-free gateway URL
          headers:
            Set-Cookie: {schema: {type: string}, description: HttpOnly Strict SameSite launch cookie with a 60-second lifetime}
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties: {url: {type: string, pattern: "^/tools/(phpmyadmin|pgadmin)/$"}}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nexa_session
  parameters:
    JobID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SiteID:
      name: id
      in: path
      required: true
      schema:
        type: string
    TaskID:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
    UploadID:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
  schemas:
    Liveness:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    ModuleDescriptor:
      type: object
      required:
        - id
        - name
        - version
        - description
        - dependencies
        - requiredCapabilities
        - estimatedIdleBytes
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        dependencies:
          type: array
          items:
            type: string
        requiredCapabilities:
          type: array
          items:
            type: string
        estimatedIdleBytes:
          type: integer
          format: int64
          minimum: 0
    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
        username:
          type: string
          minLength: 3
          maxLength: 64
        role:
          type: string
          enum: [viewer, operator, admin]
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    PasswordResponse:
      type: object
      required: [user, next]
      properties:
        user:
          $ref: "#/components/schemas/User"
        next:
          type: string
          enum: [mfa_enrollment, mfa_challenge]
    IdentityStatus:
      type: object
      required: [bootstrapRequired, authenticated, mfaEnrollmentRequired, mfaChallengeRequired]
      properties:
        bootstrapRequired:
          type: boolean
        authenticated:
          type: boolean
        mfaEnrollmentRequired:
          type: boolean
        mfaChallengeRequired:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
    TOTPCode:
      type: string
      pattern: "^[0-9]{6}$"
    MFAEnrollment:
      type: object
      required: [secret, provisioningUri]
      properties:
        secret:
          type: string
        provisioningUri:
          type: string
          pattern: "^otpauth://totp/"
    MFAConfirmation:
      type: object
      required: [user, recoveryCodes]
      properties:
        user:
          $ref: "#/components/schemas/User"
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    Error:
      description: Shared error envelope returned by every non-2xx JSON response.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Present on upload offset conflicts; the next byte offset the server expects.
    ManagedRole:
      type: string
      enum: [admin, operator, developer, viewer]
    ManagedUser:
      type: object
      required: [id, username, role, createdAt, mfaConfirmed, siteIds]
      properties:
        id: {type: string}
        username: {type: string, minLength: 3, maxLength: 64}
        role: {$ref: "#/components/schemas/ManagedRole"}
        createdAt: {type: string, format: date-time}
        lastLoginAt: {type: string, format: date-time}
        mfaConfirmed: {type: boolean}
        siteIds:
          type: array
          items: {type: string}
          description: Sites granted to a developer; empty for unscoped roles.
    CreateUser:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$"}
        password: {type: string, format: password, minLength: 12, maxLength: 1024}
        role: {$ref: "#/components/schemas/ManagedRole"}
    UpdateUser:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: {$ref: "#/components/schemas/ManagedRole"}
        password: {type: string, format: password, minLength: 12, maxLength: 1024}
    UserSiteGrants:
      type: object
      additionalProperties: false
      required: [siteIds]
      properties:
        siteIds:
          type: array
          items: {type: string}
    AuditEvent:
      type: object
      required: [id, occurredAt, action, subject, metadata]
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorUserId:
          type: string
        action:
          type: string
        subject:
          type: string
        remoteAddress:
          type: string
        metadata:
          type: object
          additionalProperties: true
    ProbeChange:
      type: object
      additionalProperties: false
      required: [present]
      properties:
        present:
          type: boolean
        content:
          type: string
          maxLength: 256
    NodeSnapshot:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        content:
          type: string
          maxLength: 256
    NodePlan:
      type: object
      required: [id, kind, target, action, changed, before, desired, plannedAt, expiresAt, signature]
      properties:
        id:
          type: string
        kind:
          type: string
          const: nexa.probe.v1
        target:
          type: string
        action:
          type: string
          enum: [none, create, update, remove]
        changed:
          type: boolean
        before:
          $ref: "#/components/schemas/NodeSnapshot"
        desired:
          $ref: "#/components/schemas/NodeSnapshot"
        plannedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signature:
          type: string
    Runtime:
      type: object
      required: [engine, version, installed, enabled, supportStatus]
      properties:
        engine:
          type: string
          const: php
        version:
          type: string
          pattern: "^(7\\.4|8\\.[0-9]{1,2})$"
        installed:
          type: boolean
        enabled:
          type: boolean
        supportStatus:
          type: string
    CreateSite:
      type: object
      additionalProperties: false
      required: [slug, displayName, primaryDomain, phpVersion]
      properties:
        slug:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,31}$"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        primaryDomain:
          type: string
          maxLength: 253
        phpVersion:
          type: string
          pattern: "^(7\\.4|8\\.[0-9]{1,2})$"
    Site:
      type: object
      required: [id, slug, displayName, primaryDomain, phpVersion, unixUser, rootPath, socketPath, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        slug:
          type: string
        displayName:
          type: string
        primaryDomain:
          type: string
        phpVersion:
          type: string
        unixUser:
          type: string
        rootPath:
          type: string
        socketPath:
          type: string
        status:
          type: string
          enum: [draft, planning, plan_ready, activating, active, rolling_back, rolled_back, failed]
        lastJobId:
          type: integer
          format: int64
        failure:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SiteArtifact:
      type: object
      required: [kind, path, mode, content]
      properties:
        kind:
          type: string
          enum: [site-root, php-fpm-pool, nginx-site]
        path:
          type: string
        mode:
          type: integer
        content:
          type: string
    SitePlan:
      type: object
      required: [id, kind, site, artifacts, before, enabledBefore, warnings, plannedAt, expiresAt, signature]
      properties:
        id: {type: string}
        kind: {type: string, const: nexa.site.activation.v1}
        site:
          $ref: "#/components/schemas/SitePlanTarget"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/SiteArtifact"
        before:
          type: array
          items: {type: object}
        enabledBefore: {type: boolean}
        warnings:
          type: array
          items:
            type: string
        plannedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        signature: {type: string}
    SitePlanTarget:
      type: object
      required: [id, slug, primaryDomain, phpVersion, unixUser, rootPath, socketPath]
      properties:
        id:
          type: string
        slug:
          type: string
        primaryDomain:
          type: string
        phpVersion:
          type: string
        unixUser:
          type: string
        rootPath:
          type: string
        socketPath:
          type: string
        routes:
          type: array
          items: {$ref: "#/components/schemas/SiteRoute"}
        tls:
          type: object
          properties:
            certificatePath: {type: string}
            privateKeyPath: {type: string}
        tlsDomains:
          type: array
          items: {type: string}
    SiteRoute:
      type: object
      required: [hostname, kind]
      properties:
        hostname: {type: string}
        kind: {type: string, enum: [subdomain, alias, redirect]}
        redirectTarget: {type: string}
    CreateDomain:
      type: object
      additionalProperties: false
      required: [siteId, hostname, kind]
      properties:
        siteId: {type: string}
        hostname: {type: string}
        kind: {type: string, enum: [subdomain, alias, redirect]}
        redirectTarget: {type: string}
    Domain:
      type: object
      required: [id, siteId, hostname, kind, status, resolvedAddresses, createdAt, updatedAt]
      properties:
        id: {type: string}
        siteId: {type: string}
        hostname: {type: string}
        kind: {type: string, enum: [primary, subdomain, alias, redirect]}
        redirectTarget: {type: string}
        status: {type: string, enum: [planning, plan_ready, activating, active, failed]}
        resolvedAddresses: {type: array, items: {type: string}}
        lastJobId: {type: integer, format: int64}
        failure: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateCertificate:
      type: object
      additionalProperties: false
      required: [siteId, email]
      properties:
        siteId: {type: string}
        email: {type: string, format: email}
    Certificate:
      type: object
      required: [id, siteId, primaryDomain, email, status, domains, expiringSoon, createdAt, updatedAt]
      properties:
        id: {type: string}
        siteId: {type: string}
        primaryDomain: {type: string}
        email: {type: string, format: email}
        status: {type: string, enum: [planning, plan_ready, issuing, active, renewing, revoking, revoked, failed]}
        domains: {type: array, items: {type: string}}
        certificatePath: {type: string}
        issuedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        expiringSoon: {type: boolean}
        lastJobId: {type: integer, format: int64}
        failure: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PostgreSQLStatus:
      type: string
      enum: [planning, plan_ready, applying, active, online, down, backing_up, verified, restoring, failed]
    CreatePostgreSQLInstance:
      type: object
      additionalProperties: false
      required: [version, cluster]
      properties:
        version: {type: string, enum: ["16", "17", "18"]}
        cluster: {type: string, pattern: "^[a-z][a-z0-9_]{1,30}$"}
        port: {type: integer, minimum: 1024, maximum: 65535}
    PostgreSQLInstance:
      type: object
      required: [id, version, cluster, port, status, owner, dataPath, socketPath, logPath, configPath, systemdUnit, managedByNexa]
      properties:
        id: {type: string}
        version: {type: string, enum: ["16", "17", "18"]}
        cluster: {type: string}
        port: {type: integer}
        status: {$ref: "#/components/schemas/PostgreSQLStatus"}
        owner: {type: string}
        dataPath: {type: string}
        socketPath: {type: string}
        logPath: {type: string}
        configPath: {type: string}
        systemdUnit: {type: string}
        managedByNexa: {type: boolean}
        lastJobId: {type: integer, format: int64}
        failure: {type: string}
    CreatePostgreSQLRole:
      type: object
      additionalProperties: false
      required: [instanceId, name]
      properties:
        instanceId: {type: string}
        name: {type: string, pattern: "^[a-z][a-z0-9_]{1,62}$"}
    PostgreSQLRole:
      type: object
      required: [id, instanceId, name, status, credentialAvailable, credentialVersion]
      properties:
        id: {type: string}
        instanceId: {type: string}
        name: {type: string}
        status: {$ref: "#/components/schemas/PostgreSQLStatus"}
        credentialAvailable: {type: boolean}
        credentialVersion: {type: integer, minimum: 0}
        lastJobId: {type: integer, format: int64}
        failure: {type: string}
    CreateManagedPostgreSQLDatabase:
      type: object
      additionalProperties: false
      required: [instanceId, name, ownerRoleId]
      properties:
        instanceId: {type: string}
        name: {type: string, pattern: "^[a-z][a-z0-9_]{1,62}$"}
        ownerRoleId: {type: string}
    ManagedPostgreSQLDatabase:
      type: object
      required: [id, instanceId, name, ownerRoleId, status]
      properties:
        id: {type: string}
        instanceId: {type: string}
        name: {type: string}
        ownerRoleId: {type: string}
        status: {$ref: "#/components/schemas/PostgreSQLStatus"}
        lastJobId: {type: integer, format: int64}
        failure: {type: string}
    CreatePostgreSQLGrant:
      type: object
      additionalProperties: false
      required: [databaseId, roleId, access]
      properties:
        databaseId: {type: string}
        roleId: {type: string}
        access: {type: string, enum: [connect, read_only, read_write]}
    PostgreSQLGrant:
      type: object
      required: [id, databaseId, roleId, access, status]
      properties:
        id: {type: string}
        databaseId: {type: string}
        roleId: {type: string}
        access: {type: string, enum: [connect, read_only, read_write]}
        status: {$ref: "#/components/schemas/PostgreSQLStatus"}
        lastJobId: {type: integer, format: int64}
        failure: {type: string}
    PostgreSQLRestorePoint:
      type: object
      required: [id, databaseId, status]
      properties:
        id: {type: string}
        databaseId: {type: string}
        status: {$ref: "#/components/schemas/PostgreSQLStatus"}
        sha256: {type: string, pattern: "^[a-f0-9]{64}$"}
        sizeBytes: {type: integer, format: int64, minimum: 0}
        verifiedAt: {type: string, format: date-time}
        lastJobId: {type: integer, format: int64}
        failure: {type: string}
    PostgreSQLStoredPlan:
      type: object
      required: [id, resourceType, resourceId, operation, agentPlan, createdAt, expiresAt]
      properties:
        id: {type: string}
        resourceType: {type: string, enum: [instance, role, database, grant, restore_point]}
        resourceId: {type: string}
        operation: {type: string, enum: [instance.provision, role.create, role.rotate, database.create, grant.apply, backup.create, backup.restore]}
        agentPlan:
          type: object
          required: [id, kind, change, steps, warnings, observedFingerprint, interruption, plannedAt, expiresAt, signature]
          properties:
            id: {type: string}
            kind: {type: string, const: nexa.postgresql.v1}
            change: {type: object, additionalProperties: true}
            steps: {type: array, items: {type: string}}
            warnings: {type: array, items: {type: string}}
            observedFingerprint: {type: string, pattern: "^[a-f0-9]{64}$"}
            interruption: {type: boolean}
            plannedAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time}
            signature: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    MySQLFamilyEngine:
      type: object
      required: [id, kind, version, versionText, socketPath, port, status, systemdUnit]
      properties:
        id: {type: string, enum: [mysql, mariadb]}
        kind: {type: string, enum: [mysql, mariadb]}
        version: {type: string}
        versionText: {type: string}
        socketPath: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        status: {type: string, enum: [online]}
        systemdUnit: {type: string}
    CreateMySQLFamilyAccount:
      type: object
      additionalProperties: false
      required: [engineId, name]
      properties:
        engineId: {type: string, enum: [mysql, mariadb]}
        name: {type: string, pattern: "^[a-z][a-z0-9_]{1,62}$"}
        host: {type: string, default: localhost}
    CreateMySQLFamilyDatabase:
      type: object
      additionalProperties: false
      required: [engineId, name, ownerAccountId]
      properties:
        engineId: {type: string, enum: [mysql, mariadb]}
        name: {type: string, pattern: "^[a-z][a-z0-9_]{1,62}$"}
        ownerAccountId: {type: string}
    CreateMySQLFamilyGrant:
      type: object
      additionalProperties: false
      required: [databaseId, accountId, access]
      properties:
        databaseId: {type: string}
        accountId: {type: string}
        access: {type: string, enum: [connect, read_only, read_write]}
    FileEntry:
      type: object
      required: [name, kind, size, mode, owner, group, modifiedAt]
      properties:
        name: {type: string}
        kind: {type: string, enum: [file, dir, symlink, other]}
        size: {type: integer, format: int64, minimum: 0}
        mode: {type: string}
        owner: {type: string}
        group: {type: string}
        modifiedAt: {type: string, format: date-time}
    FileListing:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        truncated: {type: boolean}
    FileReadResult:
      type: object
      required: [content, etag, size, truncated, binary]
      properties:
        content: {type: string}
        etag: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        truncated: {type: boolean}
        binary: {type: boolean}
    WriteFile:
      type: object
      additionalProperties: false
      required: [path, content]
      properties:
        path: {type: string}
        content: {type: string}
        expectedEtag:
          type: string
          description: Entity tag from the last read; an empty or missing value writes unconditionally.
    FileWriteResult:
      type: object
      required: [etag]
      properties:
        etag: {type: string}
    FileUpload:
      type: object
      required: [uploadId]
      properties:
        uploadId: {type: string}
    FileCopyResult:
      type: object
      required: [copied, bytes, skipped]
      properties:
        copied: {type: integer, minimum: 0}
        bytes: {type: integer, format: int64, minimum: 0}
        skipped: {type: integer, minimum: 0}
    LogFile:
      type: object
      required: [name, size, modifiedAt]
      properties:
        name: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        modifiedAt: {type: string, format: date-time}
    LogReadResult:
      type: object
      required: [lines, nextOffset, size, rotated, truncated]
      properties:
        lines:
          type: array
          items: {type: string}
        nextOffset: {type: integer, format: int64, minimum: 0}
        size: {type: integer, format: int64, minimum: 0}
        rotated: {type: boolean}
        truncated: {type: boolean}
    ScheduledTask:
      type: object
      required: [id, siteId, name, cronExpression, command, timeoutSeconds, enabled, status, pendingRemoval, createdAt, updatedAt]
      properties:
        id: {type: string, pattern: "^[a-f0-9]{32}$"}
        siteId: {type: string}
        name: {type: string, minLength: 1, maxLength: 64}
        cronExpression: {type: string}
        command: {type: string, minLength: 1, maxLength: 2048}
        timeoutSeconds: {type: integer, minimum: 10, maximum: 86400}
        enabled: {type: boolean}
        status: {type: string, enum: [draft, planning, plan_ready, activating, active, rolling_back, rolled_back, failed]}
        pendingRemoval: {type: boolean}
        lastJobId: {type: integer, format: int64}
        failure: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ScheduledTaskRequest:
      type: object
      additionalProperties: false
      required: [name, cronExpression, command, timeoutSeconds]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        cronExpression:
          type: string
          description: Exactly five numeric cron fields; names such as @daily or MON are rejected.
        command: {type: string, minLength: 1, maxLength: 2048}
        timeoutSeconds: {type: integer, minimum: 10, maximum: 86400}
        enabled: {type: boolean, default: false}
    SiteScope:
      type: object
      required: [siteId, slug, rootPath, unixUser]
      properties:
        siteId: {type: string}
        slug: {type: string}
        rootPath: {type: string}
        unixUser: {type: string}
    SchedulePlanTask:
      type: object
      required: [id, name, cronExpression, command, timeoutSeconds, enabled, scope]
      properties:
        id: {type: string}
        name: {type: string}
        cronExpression: {type: string}
        command: {type: string}
        timeoutSeconds: {type: integer}
        enabled: {type: boolean}
        scope:
          $ref: "#/components/schemas/SiteScope"
    ScheduleArtifact:
      type: object
      required: [path, mode, content, owner, group, remove]
      properties:
        path: {type: string}
        mode: {type: integer}
        content: {type: string}
        owner: {type: string}
        group: {type: string}
        remove: {type: boolean}
    ScheduleSnapshot:
      type: object
      required: [path, exists]
      properties:
        path: {type: string}
        exists: {type: boolean}
        mode: {type: integer}
        digest: {type: string}
        content: {type: string}
        uid: {type: integer}
        gid: {type: integer}
    SchedulePlan:
      type: object
      required: [id, kind, task, artifacts, before, warnings, plannedAt, expiresAt]
      properties:
        id: {type: string}
        kind: {type: string, const: nexa.schedule.change.v1}
        task:
          $ref: "#/components/schemas/SchedulePlanTask"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleArtifact"
        before:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleSnapshot"
        warnings:
          type: array
          items: {type: string}
        plannedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        signature: {type: string}
    ScheduleRunRecord:
      type: object
      required: [startedAt, durationSeconds, exitCode, trigger]
      properties:
        startedAt: {type: string, format: date-time}
        durationSeconds: {type: integer, minimum: 0}
        exitCode: {type: integer}
        trigger: {type: string}
    Job:
      type: object
      required: [id, kind, state, progress, request, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        actorUserId:
          type: string
        request:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        failure:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    JobEvent:
      type: object
      required: [sequence, jobId, state, progress, message, occurredAt]
      properties:
        sequence:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        state:
          type: string
          enum: [queued, running, succeeded, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
    SystemOverview:
      type: object
      required: [observedAt, podman, warnings]
      properties:
        observedAt:
          type: string
          format: date-time
        memory:
          $ref: "#/components/schemas/MemorySnapshot"
        podman:
          $ref: "#/components/schemas/PodmanStatus"
        warnings:
          type: array
          items:
            type: string
    MemorySnapshot:
      type: object
      required:
        - supported
        - totalBytes
        - availableBytes
        - swapTotalBytes
        - swapFreeBytes
        - usedPercent
        - profile
      properties:
        supported:
          type: boolean
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        availableBytes:
          type: integer
          format: int64
          minimum: 0
        swapTotalBytes:
          type: integer
          format: int64
          minimum: 0
        swapFreeBytes:
          type: integer
          format: int64
          minimum: 0
        usedPercent:
          type: number
          minimum: 0
          maximum: 100
        profile:
          type: string
          enum: [unsupported, compact, standard, pro]
    PodmanStatus:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        version:
          type: string
        path:
          type: string
