version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Karachi
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Asia/Karachi
    open-pull-requests-limit: 5

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
