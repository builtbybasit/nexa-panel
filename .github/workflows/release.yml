name: Release

# Publishes the per-architecture Linux binaries and their checksums as GitHub
# release assets whenever a version tag is pushed. The panel's self-update
# operator downloads exactly these asset names (nexa-linux-<arch> and
# nexa-linux-<arch>.sha256) from the release this workflow creates.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Build linux/amd64 release binary
        run: bash scripts/build-linux-release.sh amd64

      - name: Build linux/arm64 release binary
        run: bash scripts/build-linux-release.sh arm64

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          cd dist
          for arch in amd64 arm64; do
            test -f "nexa-linux-${arch}" || { echo "missing nexa-linux-${arch}" >&2; exit 1; }
            test -f "nexa-linux-${arch}.sha256" || { echo "missing nexa-linux-${arch}.sha256" >&2; exit 1; }
            sha256sum -c "nexa-linux-${arch}.sha256"
          done

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --generate-notes \
            --verify-tag \
            dist/nexa-linux-amd64 \
            dist/nexa-linux-amd64.sha256 \
            dist/nexa-linux-arm64 \
            dist/nexa-linux-arm64.sha256
