name: Release

# Publishes the per-architecture Linux release assets whenever a version tag is
# pushed. The names are a contract the installer and the self-update operator
# resolve by hand:
#
#   nexa-panel-linux-<arch>.tar.gz            the installable bundle — the binary
#     plus the packaging tree, scripts/install.sh and scripts/nexa-seed-admin.sh
#     under a single nexa-panel-<version>-linux-<arch>/ directory. Installing or
#     self-updating from a bare binary cannot work: install.sh reads packaging/
#     out of the tree it lives in, and self-update has to re-apply the units.
#   nexa-panel-linux-<arch>.tar.gz.sha256     the digest the updater verifies.
#   nexa-panel-linux-<arch>.tar.gz.sig        the detached OpenSSH signature the
#     installer and updater verify against the pinned release key.
#   nexa-panel-linux-<arch>.tar.gz.spdx.json(.sig)  the SBOM for that bundle.
#
# Every published file is signed with the release key. The bare
# nexa-linux-<arch> binary is deliberately NOT published: it shipped with only a
# .sha256 and no signature, sitting next to signed bundles it cannot be installed
# from, which is a trap rather than a convenience. It remains a local build
# product of scripts/build-linux-release.sh.
#
# Each bundle also carries a GitHub build-provenance attestation and an SBOM
# attestation, so a downloaded artifact can be traced to this workflow, this
# commit, and this dependency set with `gh attestation verify`.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write
  # Provenance and SBOM attestations are signed with a workflow OIDC identity and
  # stored in the repository's attestation store; both need their own grant.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Build linux/amd64 release binary
        run: bash scripts/build-linux-release.sh amd64

      - name: Build linux/arm64 release binary
        run: bash scripts/build-linux-release.sh arm64

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate an SBOM per release bundle
        run: |
          set -euo pipefail
          # The bundle is scanned rather than the source tree: the SBOM has to
          # describe what was published, and syft reads the Go module graph back
          # out of the binary inside it.
          for arch in amd64 arm64; do
            syft scan "file:dist/nexa-panel-linux-${arch}.tar.gz" \
              --output "spdx-json=dist/nexa-panel-linux-${arch}.tar.gz.spdx.json"
          done

      - name: Sign every published release asset
        env:
          NEXA_RELEASE_SIGNING_KEY: ${{ secrets.NEXA_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${NEXA_RELEASE_SIGNING_KEY}" || {
            echo "NEXA_RELEASE_SIGNING_KEY is not configured" >&2
            exit 1
          }
          key="$(mktemp)"
          trap 'shred -u "${key}" 2>/dev/null || rm -f "${key}"' EXIT
          chmod 0600 "${key}"
          printf '%s\n' "${NEXA_RELEASE_SIGNING_KEY}" > "${key}"
          # The SBOM is signed alongside the bundle so no published file lacks a
          # signature — an unsigned asset next to signed ones is the exact footgun
          # that retired the bare binaries.
          for arch in amd64 arm64; do
            ssh-keygen -Y sign -q -f "${key}" -n file "dist/nexa-panel-linux-${arch}.tar.gz"
            ssh-keygen -Y sign -q -f "${key}" -n file "dist/nexa-panel-linux-${arch}.tar.gz.spdx.json"
          done

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          cd dist
          for arch in amd64 arm64; do
            bundle="nexa-panel-linux-${arch}.tar.gz"
            test -f "${bundle}" || { echo "missing ${bundle}" >&2; exit 1; }
            test -f "${bundle}.sha256" || { echo "missing ${bundle}.sha256" >&2; exit 1; }
            sha256sum -c "${bundle}.sha256"
            # A bare binary must never reach the release: it would be the only
            # asset with no signature to verify.
            test ! -f "nexa-linux-${arch}.sha256" || {
              echo "${arch}: the bare binary must not carry a release checksum" >&2
              exit 1
            }
            for signed in "${bundle}" "${bundle}.spdx.json"; do
              test -f "${signed}" || { echo "missing ${signed}" >&2; exit 1; }
              test -f "${signed}.sig" || { echo "missing ${signed}.sig" >&2; exit 1; }
              ssh-keygen -Y verify \
                -f ../packaging/release-signers \
                -I nexa-panel-release \
                -n file \
                -s "${signed}.sig" \
                < "${signed}"
            done
            # An SBOM that names nothing is a generation failure that would
            # otherwise publish as a valid-looking document.
            packages="$(jq '.packages | length' "${bundle}.spdx.json")"
            test "${packages}" -ge 2 || {
              echo "${arch}: the SBOM lists only ${packages} packages" >&2
              exit 1
            }
          done

          # Extract each bundle and assert the layout install.sh depends on. A
          # tarball that ships the binary without packaging/ installs cleanly
          # right up to the point where it cannot, on someone's server; the only
          # place to catch that is here, before the release exists.
          for arch in amd64 arm64; do
            workdir="$(mktemp -d)"
            tar -xzf "nexa-panel-linux-${arch}.tar.gz" -C "${workdir}"
            root="$(find "${workdir}" -mindepth 1 -maxdepth 1 -type d)"
            test -n "${root}" || { echo "${arch}: bundle has no top-level directory" >&2; exit 1; }
            case "$(basename "${root}")" in
              nexa-panel-*-linux-"${arch}") ;;
              *) echo "${arch}: unexpected bundle directory $(basename "${root}")" >&2; exit 1 ;;
            esac
            for path in \
              bin/nexa \
              packaging/systemd/nexa-agent.service \
              packaging/systemd/nexa-api.service \
              packaging/systemd/nexa-panel-system-backup.service \
              packaging/systemd/nexa-panel-system-backup.timer \
              packaging/systemd/nexa-update-recovery.service \
              packaging/sysusers/nexa-panel.conf \
              packaging/tmpfiles/nexa-panel.conf \
              packaging/nginx/nexa-panel.conf.template \
              packaging/nginx/nexa-panel-proxy.conf.template \
              packaging/release-signers \
              scripts/install.sh \
              scripts/nexa-seed-admin.sh \
              scripts/nexa-release-helper.py \
              scripts/uninstall.sh \
              RELEASE
            do
              test -f "${root}/${path}" || { echo "${arch}: bundle is missing ${path}" >&2; exit 1; }
            done
            for path in bin/nexa scripts/install.sh scripts/nexa-seed-admin.sh scripts/nexa-release-helper.py scripts/uninstall.sh; do
              test -x "${root}/${path}" || { echo "${arch}: ${path} is not executable" >&2; exit 1; }
            done
            grep -q "^arch=${arch}$" "${root}/RELEASE" || { echo "${arch}: RELEASE does not record arch=${arch}" >&2; exit 1; }
            for key in version commit built_at; do
              grep -q "^${key}=." "${root}/RELEASE" || { echo "${arch}: RELEASE has no ${key}" >&2; exit 1; }
            done
            rm -rf "${workdir}"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/nexa-panel-linux-amd64.tar.gz
            dist/nexa-panel-linux-arm64.tar.gz

      - name: Attest the amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/nexa-panel-linux-amd64.tar.gz
          sbom-path: dist/nexa-panel-linux-amd64.tar.gz.spdx.json

      - name: Attest the arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/nexa-panel-linux-arm64.tar.gz
          sbom-path: dist/nexa-panel-linux-arm64.tar.gz.spdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${VERSION}" \
            --generate-notes \
            --verify-tag \
            dist/nexa-panel-linux-amd64.tar.gz \
            dist/nexa-panel-linux-amd64.tar.gz.sha256 \
            dist/nexa-panel-linux-amd64.tar.gz.sig \
            dist/nexa-panel-linux-amd64.tar.gz.spdx.json \
            dist/nexa-panel-linux-amd64.tar.gz.spdx.json.sig \
            dist/nexa-panel-linux-arm64.tar.gz \
            dist/nexa-panel-linux-arm64.tar.gz.sha256 \
            dist/nexa-panel-linux-arm64.tar.gz.sig \
            dist/nexa-panel-linux-arm64.tar.gz.spdx.json \
            dist/nexa-panel-linux-arm64.tar.gz.spdx.json.sig
