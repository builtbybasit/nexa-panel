name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Verify source, contracts, tests, and production build
        env:
          SHELLCHECK_REQUIRED: '1'
        run: make ci

  # Both architectures run the same executed scenarios. GitHub's Linux ARM64
  # runners boot a privileged systemd container the same way the AMD64 ones do,
  # so no scenario here is architecture-gated. The scenarios that genuinely
  # cannot run on a GitHub-hosted runner (real-certificate TLS install, reboot,
  # N-1 -> N update, injected update failure, offline rollback) are NOT faked as
  # matrix entries — see docs/ci-lifecycle.md and scripts/test-vm-lifecycle.sh.
  lifecycle:
    name: Ubuntu install lifecycle (${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
      NEXA_BIN: ./dist/nexa-linux-${{ matrix.arch }}

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Build the production binary
        run: |
          bun install --cwd web --frozen-lockfile
          bun run --cwd web build
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -tags embed -trimpath \
            -o dist/nexa-linux-${{ matrix.arch }} ./cmd/nexa

      - name: Build and start the disposable node
        run: docker compose up --build --detach nexa-node

      - name: Run host acceptance checks
        run: bash scripts/test-node-acceptance.sh nexa-node

      # Executed scenarios, not source-text assertions: idempotent re-run,
      # refused preflight, retain-data uninstall, reinstall over retained state,
      # and purge uninstall, each against a real systemd host. It runs its own
      # container off the image the step above built, so it neither disturbs
      # nexa-node nor pays for a second image build.
      - name: Run executed host lifecycle scenarios
        run: bash scripts/test-node-lifecycle.sh dist/nexa-linux-${{ matrix.arch }}

      - name: Capture diagnostics
        if: failure()
        run: |
          docker compose logs --no-color --tail 300 nexa-node
          docker exec nexa-node systemctl --failed --no-pager || true
          docker exec nexa-node journalctl -u nexa-agent -u nexa-api -u nginx --no-pager -n 300 || true

      - name: Remove the disposable node
        if: always()
        run: |
          docker rm -f nexa-lifecycle || true
          docker compose down --volumes --remove-orphans

  # The destructive database restore suites. Both destroy a real database and
  # restore it through the operator, so `go test ./...` skips them unless
  # NEXA_MYSQL_INTEGRATION / NEXA_POSTGRES_INTEGRATION are set. This job is what
  # sets them; scripts/test-db-acceptance.sh owns the engine containers, so no
  # `services:` block is used — the PostgreSQL suite has to run INSIDE a
  # PostgreSQL 18 host, which a service container cannot provide.
  database-acceptance:
    name: Database restore acceptance (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Spelled out rather than a suite x arch product: `include` entries whose
      # keys are all new are merged into every base combination, so a base
      # `suite:` axis plus an arch `include:` would silently collapse to one
      # architecture.
      matrix:
        include:
          - suite: mysql
            arch: amd64
            runner: ubuntu-24.04
          - suite: mysql
            arch: arm64
            runner: ubuntu-24.04-arm
          - suite: postgres
            arch: amd64
            runner: ubuntu-24.04
          - suite: postgres
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run the destructive restore acceptance suite
        run: bash scripts/test-db-acceptance.sh ${{ matrix.suite }}

      - name: Capture diagnostics
        if: failure()
        run: docker ps -a --no-trunc

  # The rest of the OPS-001 matrix. These are NOT absent and NOT faked: every
  # entry below expands into a job GitHub renders as "Skipped" with the reason in
  # its name, so a reader of the checks list sees the uncovered half of the gate
  # as plainly as the covered half. The condition is a literal false because no
  # GitHub-hosted runner can satisfy the preconditions at all — a public DNS name
  # with inbound :80/:443 for real ACME issuance, a machine that can reboot, and a
  # writable /usr/bin/nexa with two built releases. The implementation lives in
  # scripts/test-vm-lifecycle.sh; an operator runs it by hand on a throwaway
  # Ubuntu 24.04 VM (docs/ci-lifecycle.md), and turning these entries on means
  # pointing `runner:` at a VM runner, not editing the reasons away.
  vm-lifecycle:
    name: 'SKIPPED (needs a VM runner): ${{ matrix.scenario }} on ${{ matrix.arch }} — ${{ matrix.reason }}'
    needs: quality
    if: ${{ false }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: fresh-tls
            arch: amd64
            runner: ubuntu-24.04
            reason: real Let's Encrypt issuance needs a public DNS name and inbound 80/443
          - scenario: fresh-tls
            arch: arm64
            runner: ubuntu-24.04-arm
            reason: real Let's Encrypt issuance needs a public DNS name and inbound 80/443
          - scenario: reboot
            arch: amd64
            runner: ubuntu-24.04
            reason: restarting a container's PID 1 is not a host boot
          - scenario: reboot
            arch: arm64
            runner: ubuntu-24.04-arm
            reason: restarting a container's PID 1 is not a host boot
          - scenario: update
            arch: amd64
            runner: ubuntu-24.04
            reason: needs two built releases and a writable /usr/bin/nexa
          - scenario: update
            arch: arm64
            runner: ubuntu-24.04-arm
            reason: needs two built releases and a writable /usr/bin/nexa
          - scenario: update-failure
            arch: amd64
            runner: ubuntu-24.04
            reason: needs a live activation to fail and be undone on a host it owns
          - scenario: update-failure
            arch: arm64
            runner: ubuntu-24.04-arm
            reason: needs a live activation to fail and be undone on a host it owns
          - scenario: offline-rollback
            arch: amd64
            runner: ubuntu-24.04
            reason: only meaningful with nexa-api and nexa-agent genuinely stopped
          - scenario: offline-rollback
            arch: arm64
            runner: ubuntu-24.04-arm
            reason: only meaningful with nexa-api and nexa-agent genuinely stopped

    steps:
      - name: Explain why this scenario did not run
        run: |
          echo "${{ matrix.scenario }} (${{ matrix.arch }}) is not covered by CI: ${{ matrix.reason }}"
          echo "Run it by hand on a throwaway Ubuntu 24.04 VM; see docs/ci-lifecycle.md."
          exit 1
