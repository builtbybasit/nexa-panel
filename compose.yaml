# Disposable Ubuntu 24.04 test node running Nexa Panel under systemd, laid out
# like the .deb would install it (see Dockerfile). The container runs systemd as
# PID 1, so it needs a privileged, cgroup-mounted setup — this is a test node,
# not a production deployment.
#
# /usr/bin/nexa is bind-mounted from a release binary in dist/ (built by
# scripts/build-linux-release.sh), NOT baked into the image. $NEXA_BIN selects
# which one — set it in the gitignored .env to match the HOST arch. Apple Silicon
# is arm64, which is what build-linux-release.sh and the mount default below use.
#
# Build the SAME arch you run, then RESTART so the process re-execs the new
# binary. `up --build` only rebuilds the IMAGE (which does not contain the
# binary), so on its own it will NOT pick up a rebuilt binary:
#
#   bash scripts/build-linux-release.sh && docker compose restart nexa-node   # arm64 (default)
#
# On an amd64 host, build amd64 and point the mount at it:
#   bash scripts/build-linux-release.sh amd64
#   NEXA_BIN=./dist/nexa-linux-amd64 docker compose restart nexa-node
#
#   docker compose up --build -d      # build image + start (first run)
#   docker compose logs -f            # follow systemd/service logs
#   docker compose down               # stop and remove
#
# Panel: http://localhost:8888 (embedded production UI)

services:
  nexa-node:
    build:
      context: .
    image: nexa-node
    container_name: nexa-node
    # systemd as PID 1 needs full privileges and the host's cgroup namespace.
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3        # tell systemd to shut down cleanly
    # This privileged systemd container does not resolve through Docker's
    # embedded DNS (127.0.0.11), so package installs (apt-get update) fail to
    # reach the mirrors. Point glibc at public resolvers; egress by IP works.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8888:8888"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Default matches the host (Apple Silicon = arm64) and the gitignored .env;
      # amd64 hosts override with NEXA_BIN=./dist/nexa-linux-amd64.
      - ${NEXA_BIN:-./dist/nexa-linux-arm64}:/usr/bin/nexa:ro
    tmpfs:
      - /run
      - /run/lock
    # This is a disposable test node: state under /var/lib/nexa-panel (the SQLite
    # control DB + master key) is created fresh on each `up` by systemd's
    # StateDirectory. Persisting it via a named volume is intentionally left out —
    # a volume mounted there starts root-owned and trips the same readonly-database
    # failure the panel already hit; keep state ephemeral for this image.
